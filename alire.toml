name = "espidf_mdns"
version = "0.1.0-dev"
website = "https://github.com/godunko/espidf_http_server"
description = "Ada/ESP-IDF: ESP-Protocols/mDNS Bindings"
long-description = """
Ada bindings for the ESP-IDF mDNS (Multicast DNS) component, enabling ESP32 microcontrollers running Ada to perform zero-configuration networking.
"""

authors = ["Vadim Godunko"]
maintainers = ["Vadim Godunko <vgodunko@gmail.com>"]
maintainers-logins = ["godunko"]
licenses = "Apache-2.0 WITH LLVM-exception"
tags = ["a0b", "embedded", "esp", "esp32", "espidf"]

[configuration]
generate_ada = false
generate_c = false
generate_gpr = true

[[depends-on]]
espidf = "*"
